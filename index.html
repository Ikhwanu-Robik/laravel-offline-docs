<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laravel 12 Documentation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1em;
      }

      ul {
        list-style-type: none;
      }

        font-family: 'Courier New', Courier, monospace;
      }

        background-color: rgb(255, 13, 0);

      }

        padding: 1.5em;

        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>Laravel 12 Documentation</h1>
    <div id="toc-container">
      <h2>Table of Contents</h2>
      
      <ul id="table-of-contents"></ul>
    </div>

    <details>
      <summary>How do I add entry?</summary>
      <i>to add entry, modify the </i><span class="code-snippet">markdowns</span><i>
      constant of the script tag in the source code.</i>
    </details>
    <script>

          "telescope.md",
          "valet.md",
        ],
        License: ["license.md"],
      };

      const filePath = "file://C:/laragon/www/laravel-12-docs/";

      function removeExtension(fileName) {
        let parts = fileName.split('.');
        let fileNameOnly = parts[0];
        return fileNameOnly;
      }

      function createTocItem(fileName) {
        let url = filePath + fileName;

        let link = document.createElement("a");
        link.setAttribute("href", url);
        link.textContent = removeExtension(fileName);

        let li = document.createElement("li");
        li.appendChild(link);

        return li;
      }

      function createSummary(textContent) {
        let summary = document.createElement("summary");
        summary.textContent = textContent;
        return summary;
      }

      let tableOfContents = document.getElementById("table-of-contents");

      for (let groupName in markdownGroups) {
        let group = markdownGroups[groupName];

        let summary = createSummary(groupName);
        let detail = document.createElement("details");
        detail.appendChild(summary);

        let groupList = document.createElement("ul");
        group.map((markdown) => {
          let tocItem = createTocItem(markdown);
          groupList.appendChild(tocItem);
        });

        detail.appendChild(groupList);

        let detailListItem = document.createElement("li");
        detailListItem.appendChild(detail);
        tableOfContents.appendChild(detailListItem);
      }
    </script>
  </body>
</html>
